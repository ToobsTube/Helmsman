name: Helmsman ECU

# Emergency control unit for Helmsman ships. Takes over when you leave the
# seat while flying:
#   - near a planet: levels the ship, stops any drift, and HOVERS at
#     HoverHeight over whatever the hovers / vertical boosters see -
#     ground or WATER (DU's hover mode holds over water too). From high up
#     it falls (braked to under ~100 km/h, kept straight down) until they see
#     something, then catches and holds there.
#   - in space: brakes to a stop and holds still.
# Link: core, and at least one hover engine (hover) and/or vertical
# booster (vBooster) so it can read the distance below.
# It burns fuel the whole time it hovers. When you sit back down, the ECU
# stops and your seat script takes over. The AGG is never touched.

slots:
    core:
        class: CoreUnit
    hover:
        class: Hovercraft
    vBooster:
        class: VerticalBooster
handlers:
    unit:
        onStart:
            lua: |
                HoverHeight = 10 --export: Height (m) to hover above the ground / water
                MaxFall = 100    --export: Fastest fall (km/h) while it looks for the ground from high up
                Nav = Navigator.new(system, core, unit)
                local acm = Nav.axisCommandManager
                acm:resetCommand(axisCommandId.longitudinal)
                acm:resetCommand(axisCommandId.lateral)
                acm:resetCommand(axisCommandId.vertical)
                acm:setTargetGroundAltitude(HoverHeight)
                acm:activateGroundEngineAltitudeStabilization(HoverHeight)
                function EcuGround()
                    local best = -1
                    for _, e in ipairs({ hover, vBooster }) do
                        if e then
                            local ok, d = pcall(e.getDistance)
                            if ok and type(d) == "number" and d >= 0 and (best < 0 or d < best) then best = d end
                        end
                    end
                    return best
                end
                local g = vec3(core.getWorldGravity()):len()
                if not hover and not vBooster then
                    system.print("[HELM ECU] No hover / vertical booster linked: it can't see the ground - braking only")
                elseif g < 0.1 then
                    system.print("[HELM ECU] In space - stopping and holding still")
                else
                    system.print(string.format("[HELM ECU] Taking over - hovering %.0f m above the ground / water (sit back down to fly)", HoverHeight))
                end
    system:
        onFlush:
            lua: |
                local keep, tol = 1, 1
                local g = vec3(core.getWorldGravity())
                local glen = g:len()
                local vel = vec3(construct.getWorldVelocity())
                local speed = vel:len()
                local velDir = speed > 0.01 and vel / speed or vec3()
                local up = vec3(construct.getWorldOrientationUp())
                local angVel = vec3(construct.getWorldAngularVelocity())
                local seen = EcuGround()

                -- Level with the planet (or just stop turning in space).
                local ang
                if glen > 0.1 then
                    local skyUp = -g / glen
                    ang = up:cross(skyUp) * 4 - angVel * 2.5
                else
                    ang = -angVel * 3
                end
                Nav:setEngineCommand('torque', vec3(), ang)

                -- No pushing forward / sideways.
                Nav:setEngineForceCommand('thrust analog longitudinal', vec3(), keep)
                Nav:setEngineForceCommand('thrust analog lateral', vec3(), keep)

                -- Height: DU's hover mode on the ground engines (holds over
                -- ground and water); other vertical engines stay idle.
                local gAcc = Nav.axisCommandManager:composeAxisAccelerationFromThrottle('thrust analog vertical', axisCommandId.vertical)
                Nav:setEngineForceCommand('thrust analog vertical', gAcc, keep, 'airfoil', 'ground', '', tol)

                -- Brakes: full in space; near a planet, any sideways drift,
                -- and while still looking for the ground, a fall faster
                -- than MaxFall.
                local brake = 0
                if glen <= 0.1 then
                    brake = speed > 0.05 and 1 or 0
                else
                    local wv = g / glen
                    local vDown = vel:dot(wv)
                    local hSpeed = (vel - wv * vDown):len()
                    if hSpeed > 0.3 then brake = math.min(math.max(hSpeed / 3, 0.2), 1) end
                    if seen < 0 and vDown > (MaxFall or 100) / 3.6 then brake = 1 end
                    if seen >= 0 and vDown > 3 then brake = 1 end   -- coming into range: catch it
                end
                Nav:setEngineForceCommand('brake', -brake * (3 * vel + velDir))
        onUpdate:
            lua: |
                Nav:update()

name: Helmsman ECU

# Emergency control unit for Helmsman ships. Takes over when you leave the
# seat while flying:
#   - near a planet: levels the ship, stops any drift, and HOVERS at
#     HoverHeight over whatever the hovers / vertical boosters see -
#     ground or WATER (DU's hover mode holds over water too). From high up
#     it falls (braked to under ~100 km/h, kept straight down) until they see
#     something, then catches and holds there.
#   - in space: brakes to a stop and holds still.
# Link: core, and at least one hover engine (hover) and/or vertical
# booster (vBooster) so it can read the distance below.
# It burns fuel the whole time it hovers. When you sit back down, the ECU
# stops and your seat script takes over. The AGG is never touched.

slots:
    core:
        class: CoreUnit
    hover:
        class: Hovercraft
    vBooster:
        class: VerticalBooster
    telemeter:
        class: TelemeterUnit
    databank:
        class: databank
        select: manual
handlers:
    unit:
        onStart:
            lua: |
                HoverHeight = 10 --export: Height (m) to hover above the ground / water
                MaxFall = 100    --export: Fastest fall (km/h) while it looks for the ground from high up
                MaxFallTele = 300 --export: With a telemeter pointing down: fastest fall (km/h) while it sees nothing in its range (it slows down in time once it sees the ground)
                LandMinutes = 5  --export: Lands when the fuel feeding the running engines would last less than this (minutes). 0 = never
                -- Fuel: every tank, read through the core (no links). The
                -- ones getting lighter are feeding the engines that run.
                Tanks = {}
                do
                    local okL, ids = pcall(core.getElementIdList)
                    if okL and type(ids) == "table" then
                        for _, id in ipairs(ids) do
                            local _, nm = pcall(core.getElementDisplayNameById, id)
                            if tostring(nm or ""):lower():find("fuel tank") then
                                local okI, itemId = pcall(core.getElementItemIdById, id)
                                local okG, item = pcall(system.getItem, okI and itemId or 0)
                                local dry = (okG and type(item) == "table" and tonumber(item.unitMass)) or 0
                                table.insert(Tanks, { id = id, dry = dry })
                            end
                        end
                    end
                end
                EcuLand, FuelT, FuelMsgT, StillT = false, 0, 0, nil
                -- Find the parts by what they are, not by slot name (works
                -- for this .conf and for pasted Lua with slot1..slot10).
                local function cls(e)
                    if type(e) ~= "table" then return "" end
                    local ok, c = pcall(function() return e.getClass() end)
                    if not ok or not c then ok, c = pcall(function() return e.getElementClass() end) end
                    c = ok and c and tostring(c):lower() or ""
                    -- (a databank by what it can do, whatever it calls itself:
                    -- Carl's linked bank showed "databank none")
                    if c == "" and type(e.getStringValue) == "function" and type(e.getKeyList) == "function" then c = "databank" end
                    return c
                end
                local found = {}
                -- (DU sometimes names a manually linked slot "databank_1" etc.)
                for _, e in pairs({ core, hover, hover_1, vBooster, vBooster_1, telemeter, telemeter_1,
                                    databank, databank_1, databank_2,
                                    slot1, slot2, slot3, slot4, slot5,
                                    slot6, slot7, slot8, slot9, slot10, slot11, slot12 }) do
                    local c = cls(e)
                    if c:find("core") then core = core or e; found.core = found.core or e
                    elseif c:find("verticalbooster") or c:find("hover") then
                        found.ground = found.ground or {}
                        table.insert(found.ground, e)
                    elseif c:find("telemeter") then
                        found.tele = found.tele or {}
                        table.insert(found.tele, e)
                    elseif c:find("databank") or (type(e.getStringValue) == "function" and type(e.getKeyList) == "function") then
                        found.bank = found.bank or e
                    end
                end
                core = found.core or core
                GroundSensors = found.ground or {}
                Teles, Bank = found.tele or {}, found.bank
                -- Telemeter pointing DOWN (sees ~100 m): which way it points
                -- isn't known from the link. Trusted once a hit lands straight
                -- below IT, or if Helmsman already learned it (shared databank).
                function EcuTele()
                    local gv = vec3(core.getWorldGravity())
                    if gv:len() < 0.1 or #Teles == 0 then return -1, 0 end
                    local dn = gv / gv:len()
                    local pos = vec3(construct.getWorldPosition())
                    local best, range = -1, 0
                    for _, t in ipairs(Teles) do
                        if t.ecuDown == nil then
                            t.ecuDown = false
                            local okI, id = pcall(t.getLocalId)
                            if okI and id then
                                if Bank then
                                    local okV, v = pcall(Bank.getStringValue, "sf_tdown_"..tostring(id))
                                    t.ecuDown = okV and tonumber(v) == 1
                                end
                                local okP, lp = pcall(core.getElementPositionById, id)
                                t.ecuOff = (okP and type(lp) == "table") and vec3(lp[1] or lp.x or 0, lp[2] or lp.y or 0, lp[3] or lp.z or 0) or vec3()
                            else
                                t.ecuOff = vec3()
                            end
                        end
                        local okR, r = pcall(t.raycast)
                        local okM, m = pcall(t.getMaxDistance)
                        m = (okM and tonumber(m)) or 100
                        if okR and type(r) == "table" and r.hit and r.point then
                            local L = t.ecuOff
                            local o = pos + vec3(construct.getWorldOrientationRight()) * L.x
                                          + vec3(construct.getWorldOrientationForward()) * L.y
                                          + vec3(construct.getWorldOrientationUp()) * L.z
                            local v = vec3(r.point.x or r.point[1], r.point.y or r.point[2], r.point.z or r.point[3]) - o
                            if v:len() > 0.5 and (v / v:len()):dot(dn) > 0.95 then t.ecuDown = true end
                            if t.ecuDown then
                                local d = tonumber(r.distance) or v:len()
                                if best < 0 or d < best then best = d end
                            end
                        end
                        if t.ecuDown then range = math.max(range, m) end
                    end
                    return best, range
                end
                Nav = Navigator.new(system, core, unit)
                local acm = Nav.axisCommandManager
                acm:resetCommand(axisCommandId.longitudinal)
                acm:resetCommand(axisCommandId.lateral)
                acm:resetCommand(axisCommandId.vertical)
                -- Under water (below sea level): hovers read 0 there and
                -- would push for the surface, so instead hold THIS spot
                -- with the engines (Helmsman's Maneuver mode does the same).
                local okA, alt = pcall(core.getAltitude)
                Underwater = okA and tonumber(alt) and alt < -3 and vec3(core.getWorldGravity()):len() > 0.1
                HoldPos = vec3(construct.getWorldPosition())
                if Underwater then
                    acm:deactivateGroundEngineAltitudeStabilization()
                else
                    acm:setTargetGroundAltitude(HoverHeight)
                    acm:activateGroundEngineAltitudeStabilization(HoverHeight)
                end
                function EcuGround()
                    local best = -1
                    for _, e in ipairs(GroundSensors) do
                        local ok, d = pcall(e.getDistance)
                        if ok and type(d) == "number" and d >= 0 and (best < 0 or d < best) then best = d end
                    end
                    return best
                end
                local g = vec3(core.getWorldGravity()):len()
                -- What it found (so a missing link shows at once)
                local _, tR0 = EcuTele()
                system.print(string.format("[HELM ECU] Links: ground sensors %d · telemeter %s · databank %s",
                    #GroundSensors,
                    #Teles == 0 and "none" or (tR0 > 0 and "pointing down" or "linked, direction not known yet"),
                    Bank and "linked" or "none"))
                if #GroundSensors == 0 then
                    system.print("[HELM ECU] No hover / vertical booster linked: it can't see the ground - braking only")
                elseif g < 0.1 then
                    system.print("[HELM ECU] In space - stopping and holding still")
                elseif Underwater then
                    system.print(string.format("[HELM ECU] Under water (%.0f m) - holding this spot with the engines (sit back down to fly)", alt))
                else
                    system.print(string.format("[HELM ECU] Taking over - hovering %.0f m above the ground / water (sit back down to fly)", HoverHeight))
                end
    system:
        onFlush:
            lua: |
                local keep, tol = 1, 1
                local g = vec3(core.getWorldGravity())
                local glen = g:len()
                local vel = vec3(construct.getWorldVelocity())
                local speed = vel:len()
                local velDir = speed > 0.01 and vel / speed or vec3()
                local up = vec3(construct.getWorldOrientationUp())
                local angVel = vec3(construct.getWorldAngularVelocity())
                local seen = EcuGround()

                -- Level with the planet (or just stop turning in space).
                local ang
                if glen > 0.1 then
                    local skyUp = -g / glen
                    ang = up:cross(skyUp) * 4 - angVel * 2.5
                else
                    ang = -angVel * 3
                end
                Nav:setEngineCommand('torque', vec3(), ang)

                -- Under water: every engine holds this exact spot (a spring
                -- back to it, damped), hovers off. Fuel watch still lands it.
                if Underwater and not EcuLand then
                    local pos = vec3(construct.getWorldPosition())
                    local acc = (HoldPos - pos) * 0.5 - vel * 1.4 - g
                    Nav:setEngineForceCommand('thrust analog', acc, 0, '', '', '', tol)
                    -- hovers / boosters help with the vertical part (DU's own
                    -- hover hold stays off: under water it pushes flat out)
                    local wvE = g / glen
                    Nav:setEngineForceCommand('ground', wvE * acc:dot(wvE), keep)
                    Nav:setEngineForceCommand('brake', (speed > 3 and -0.5 or 0) * (3 * vel + velDir))
                    return
                end

                -- No pushing forward / sideways.
                Nav:setEngineForceCommand('thrust analog longitudinal', vec3(), keep)
                Nav:setEngineForceCommand('thrust analog lateral', vec3(), keep)

                -- Height: DU's hover mode on the ground engines (holds over
                -- ground and water); other vertical engines stay idle.
                -- Low fuel: no more hovering - a slow, steady descent (2 m/s)
                -- onto the ground, or the seabed.
                if EcuLand and glen > 0.1 then
                    local wv = g / glen
                    local vDown = vel:dot(wv)
                    -- 2 m/s near the ground; with a down telemeter that sees
                    -- the ground (or the seabed, through water) further off,
                    -- faster until ~15 m, slowing in time (Carl: expected the
                    -- linked databank / telemeter to make it land faster).
                    local vSet = 2
                    local tD, tR = EcuTele()
                    if tR > 0 and (tD < 0 or tD > 15) then
                        local okB, mb = pcall(construct.getMaxBrake)
                        local a = math.max((okB and tonumber(mb) or 0) / math.max(construct.getMass(), 1) * 0.5 - glen, 1)
                        local D = math.max((tD >= 0 and tD or tR) - 15, 0)
                        vSet = math.min(math.max(-a + math.sqrt(a * a + 2 * a * D), 2), 30)
                    end
                    EcuVSet = vSet
                    local vAcc = wv * ((vSet - vDown) * 2) - g
                    Nav:setEngineForceCommand('thrust analog vertical', vAcc, keep, 'airfoil', 'ground', '', tol)
                    -- Down and still for 3 s: switch the ECU off (no more fuel burnt).
                    if speed < 0.2 then
                        StillT = StillT or system.getArkTime()
                        if system.getArkTime() - StillT > 3 then
                            system.print("[HELM ECU] Landed - ECU off, engines stopped")
                            unit.exit()
                        end
                    else
                        StillT = nil
                    end
                else
                    local gAcc = Nav.axisCommandManager:composeAxisAccelerationFromThrottle('thrust analog vertical', axisCommandId.vertical)
                    Nav:setEngineForceCommand('thrust analog vertical', gAcc, keep, 'airfoil', 'ground', '', tol)
                end

                -- Brakes: full in space; near a planet, any sideways drift,
                -- and while still looking for the ground, a fall faster
                -- than MaxFall.
                local brake = 0
                if glen <= 0.1 then
                    brake = speed > 0.05 and 1 or 0
                else
                    local wv = g / glen
                    local vDown = vel:dot(wv)
                    local hSpeed = (vel - wv * vDown):len()
                    if hSpeed > 0.3 then brake = math.min(math.max(hSpeed / 3, 0.2), 1) end
                    if seen < 0 then
                        -- Looking for the ground: no faster than it can stop
                        -- within what a down telemeter sees (minus ~15 m for the
                        -- hovers to take over, ~1 s for the brakes to bite);
                        -- without one, MaxFall.
                        local cap = (MaxFall or 100) / 3.6
                        local tD, tR = EcuTele()
                        if tR > 0 then
                            local okB, mb = pcall(construct.getMaxBrake)
                            local a = math.max((okB and tonumber(mb) or 0) / math.max(construct.getMass(), 1) * 0.5 - glen, 1)
                            local D = math.max((tD >= 0 and tD or tR) - 15, 0)
                            cap = math.max(-a + math.sqrt(a * a + 2 * a * D), 3)
                            if tD < 0 then cap = math.min(cap, (MaxFallTele or 300) / 3.6) end
                        end
                        if vDown > cap then brake = 1 end
                    end
                    if seen >= 0 and vDown > 3 and not EcuLand then brake = 1 end   -- coming into range: catch it
                    if EcuLand and vDown > (EcuVSet or 2) + 2 then brake = 1 end
                end
                Nav:setEngineForceCommand('brake', -brake * (3 * vel + velDir))
        onUpdate:
            lua: |
                Nav:update()
                -- Fuel watch, every 2 s: how long the tank that drains
                -- fastest (for what it holds) has left.
                local t = system.getArkTime()
                if t - FuelT >= 2 then
                    FuelT = t
                    local worst
                    for _, k in ipairs(Tanks) do
                        local ok, m = pcall(core.getElementMassById, k.id)
                        if ok and tonumber(m) then
                            local kg = math.max(m - k.dry, 0)
                            if k.last then
                                local r = (k.last - kg) / (t - k.lastT)
                                if r < -0.01 then k.rate = 0                       -- refuelled
                                else k.rate = k.rate and (k.rate * 0.8 + math.max(r, 0) * 0.2) or math.max(r, 0) end
                            end
                            k.last, k.lastT = kg, t
                            if k.rate and k.rate > 0.0005 then
                                local left = kg / k.rate
                                if not worst or left < worst then worst = left end
                            end
                        end
                    end
                    local glen = vec3(core.getWorldGravity()):len()
                    if worst and t - FuelMsgT >= 60 and not EcuLand then
                        FuelMsgT = t
                        system.print(string.format("[HELM ECU] Hovering - fuel lasts about %.0f min (lands at %d min)", worst / 60, LandMinutes))
                    end
                    if worst and LandMinutes > 0 and worst < LandMinutes * 60 and not EcuLand and glen > 0.1 then
                        EcuLand = true
                        Nav.axisCommandManager:deactivateGroundEngineAltitudeStabilization()
                        pcall(unit.deployLandingGears)
                        system.print(string.format("[HELM ECU] Fuel low (about %.0f min left) - landing slowly", worst / 60))
                    end
                end
